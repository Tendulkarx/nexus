name: PR title

# PRs are squash-merged with their title as the commit message, and release-please
# reads those messages to pick the next version and write the release notes:
#   feat: … → minor bump, under "New features"
#   fix: …  → patch bump, under "Fixes"
#   feat!: … or a "BREAKING CHANGE:" footer → major bump
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
